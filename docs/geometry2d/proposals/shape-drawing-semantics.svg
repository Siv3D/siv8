<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">形が似ていても API の意味は異なる</title><desc id="desc">円弧の丸い線端と扇形の角丸、円の拡大と楕円の法線幅、可変幅と二曲線の帯、重ね描きと単一輪郭の半透明を比較。</desc>
<style>text{font-family:Inter,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.code{font-family:Menlo,Consolas,monospace}</style>
<rect width="1440" height="1120" fill="#f3f6f7"/>
<text x="36" y="52" font-size="30" font-weight="700" fill="#183043" >見た目が似ていても、仕様を分けたい四つの違い</text><text x="37" y="86" font-size="16" font-weight="400" fill="#597080" >色のついた図形は説明用 SVG。候補番号はレポートと共通。</text><rect x="36" y="112" width="1368" height="232" rx="16" fill="white" stroke="#dbe4e8"/><text x="57" y="144" font-size="22" font-weight="650" fill="#183043" >01  丸い線端と、扇形の四隅の角丸</text><text x="60" y="175" font-size="16" font-weight="400" fill="#597080" >既存 Round cap：中心線の端から半円が張り出す</text><text x="745" y="175" font-size="16" font-weight="400" fill="#597080" >候補 04：扇形の内部で四隅を丸める</text><path d="M720,174 V326" stroke="#e2e9ed"/><g transform="translate(300 254) rotate(0)"><path d="M0,0 L-65.607,-61.609" fill="none" stroke="#a1b3bf" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M0,0 L40.859,80.191" fill="none" stroke="#a1b3bf" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M-39.364,-36.966 A54,54 0 1 1 24.515,48.114" fill="none" stroke="#008b82" stroke-width="32" stroke-linecap="round"/></g><g transform="translate(1005 254) rotate(0)"><path d="M0,0 L-65.607,-61.609" fill="none" stroke="#a1b3bf" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M0,0 L40.859,80.191" fill="none" stroke="#a1b3bf" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M-43.98,-41.3 A9,9 0 0 1 -43.399,-54.923 A70,70 0 1 1 40.634,56.999 A9,9 0 0 1 27.39,53.757 L20.943,41.102 A9,9 0 0 1 23.416,29.928 A38,38 0 0 0 -22.207,-30.836 A9,9 0 0 1 -33.628,-31.578 Z" fill="#5068d4" /></g><rect x="36" y="364" width="1368" height="232" rx="16" fill="white" stroke="#dbe4e8"/><text x="57" y="396" font-size="22" font-weight="650" fill="#183043" >02  円の非一様拡大と、法線方向の一定幅</text><text x="60" y="427" font-size="16" font-weight="400" fill="#597080" >円と stroke を一緒に拡大：横と縦で幅が変わる</text><text x="745" y="427" font-size="16" font-weight="400" fill="#597080" >既存楕円枠・候補 03：法線方向に幅を付ける</text><path d="M720,426 V578" stroke="#e2e9ed"/><g transform="translate(300 514) rotate(0)"><g transform="scale(1.9 .75)"><circle r="55" fill="none" stroke="#008b82" stroke-width="14"/></g></g><g transform="translate(1005 514) rotate(0)"><ellipse rx="104.5" ry="41.25" fill="none" stroke="#5068d4" stroke-width="14"/></g><rect x="36" y="616" width="1368" height="232" rx="16" fill="white" stroke="#dbe4e8"/><text x="57" y="648" font-size="22" font-weight="650" fill="#183043" >03  中心線に幅を付ける帯と、二つの境界で作る帯</text><text x="60" y="679" font-size="16" font-weight="400" fill="#597080" >候補 09：中心線と弧長に沿う幅を指定</text><text x="745" y="679" font-size="16" font-weight="400" fill="#597080" >候補 10：二つの曲線を独立に指定</text><path d="M720,678 V830" stroke="#e2e9ed"/><g transform="translate(140 697) rotate(0)"><path d="M17.609,89.482 L19.439,85.722 L21.298,82.204 L23.182,78.921 L25.089,75.864 L27.016,73.025 L28.962,70.393 L30.925,67.96 L32.905,65.714 L34.902,63.644 L36.92,61.739 L38.96,59.99 L41.028,58.384 L43.128,56.913 L45.266,55.567 L47.45,54.34 L49.685,53.224 L51.979,52.216 L54.336,51.31 L56.763,50.504 L59.264,49.795 L61.841,49.183 L64.497,48.666 L67.233,48.243 L70.05,47.913 L72.948,47.674 L75.924,47.525 L78.978,47.465 L82.107,47.49 L85.309,47.599 L88.582,47.788 L91.923,48.055 L95.33,48.395 L98.799,48.805 L102.328,49.28 L105.915,49.817 L109.557,50.41 L113.252,51.056 L116.997,51.749 L120.79,52.485 L124.63,53.258 L128.513,54.064 L132.439,54.896 L136.405,55.751 L140.41,56.622 L144.452,57.505 L148.529,58.394 L152.64,59.284 L156.783,60.169 L160.957,61.044 L165.161,61.903 L169.393,62.742 L173.651,63.554 L177.936,64.334 L182.244,65.076 L186.575,65.776 L190.928,66.427 L195.301,67.024 L199.693,67.561 L204.103,68.033 L208.53,68.434 L212.971,68.759 L217.426,69.001 L221.893,69.156 L226.372,69.218 L230.859,69.18 L235.354,69.039 L239.855,68.787 L244.36,68.421 L248.868,67.933 L253.377,67.319 L257.884,66.574 L262.389,65.693 L266.888,64.67 L271.381,63.5 L275.865,62.179 L280.338,60.702 L284.799,59.064 L289.246,57.26 L293.677,55.286 L298.091,53.138 L302.486,50.811 L306.861,48.301 L311.214,45.603 L315.545,42.714 L319.853,39.629 L324.137,36.343 L328.396,32.